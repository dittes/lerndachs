<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#4fbaa8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>Lerndachs · Spielen & entdecken</title><meta name="description" content="Eine lebendige Lernspielwelt: zählen, lesen und die Natur entdecken. Mit Klassenauswahl, lehrplanorientierten Spielaufgaben und erspielbaren Haustieren, frei bewegbaren Figuren und deinem eigenen Gartenloft."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="immersive.css"><link rel="stylesheet" href="learning.css"><link rel="stylesheet" href="journey.css"><link rel="stylesheet" href="adults.css"><link rel="stylesheet" href="social.css"><script defer src="vendor/pdf-lib.min.js"></script><script defer src="app.js"></script></head>
<body>
<main class="game-shell" aria-label="Lerndachs – Lernspiel">
<div class="playground"><div class="scene-scroll" id="scene-scroll"><svg id="world" viewBox="0 0 1600 900" role="group" aria-label="Interaktive Spielwelt. Alles anfassen, bewegen und einpacken."><g id="backdrop"></g><g id="objects"></g><g id="effects" pointer-events="none"></g></svg></div><div class="night-shade" aria-hidden="true"></div></div>
<header class="game-hud">
<div class="hud-left"><button id="map-button" class="place-pill" aria-label="Nachbarschaft öffnen"><span class="place-mark brand-badger" aria-hidden="true"></span><span><span class="wordmark">Lerndachs</span><span id="location">Gartenloft</span></span><span class="chevron">⌄</span></button></div>
<div class="hud-right"><button class="wallet" id="wallet" aria-label="Sterne und Belohnungen"><span class="star">✦</span><span id="balance">0</span><span class="plus">+</span></button><div class="utility-buttons"><button id="day-toggle" class="round-button" aria-label="Zur Nacht wechseln" aria-pressed="false" data-icon="sun"></button><button id="motion-toggle" class="round-button" aria-label="Animationen pausieren" aria-pressed="false" data-icon="pause"></button><button id="sound-toggle" class="round-button" aria-label="Töne einschalten" aria-pressed="false" data-icon="sound"></button><button id="help" class="round-button" aria-label="Einstellungen öffnen" data-icon="settings"></button></div></div>
</header>
<div class="scene-caption"><span id="grade-label"></span><span class="tiny-dot"></span> <span id="day-label">Dein Tag. Deine Geschichte.</span></div>
<div id="welcome-hint"><span class="hint-spark">✦</span><span><strong>Willkommen bei Lerndachs!</strong><small>Spiele frei oder entdecke mit Dachs!</small></span><button id="dismiss-hint" aria-label="Hinweis schließen">×</button></div>
<button id="adventure-button" class="adventure-button" aria-label="Nächste Aufgabe anzeigen"><span class="badger-icon" aria-hidden="true"></span><span><small>SPIEL DICH SCHLAU</small><strong>Ein kleines Abenteuer?</strong><em>Mit Dachs die Welt entdecken →</em></span></button><div id="quest-strip" hidden></div><div id="radio-dock" hidden><span id="radio-station">Radio</span><select id="radio-select" aria-label="Musik auswählen"></select><button id="radio-tune" aria-label="Radiosender wechseln">↻ Sender</button><button id="radio-power" aria-label="Radio ausschalten">■</button></div><div id="selection" class="selection-tray" hidden><span id="selected-name"></span><button id="use-object" aria-label="Ausgewähltes Objekt benutzen" data-icon="spark"></button><button id="flip-object" aria-label="Ausgewähltes Objekt spiegeln" data-icon="flip"></button><button id="pack-object" aria-label="Ausgewähltes Objekt einpacken" data-icon="bag"></button><button id="deselect" aria-label="Auswahl aufheben">×</button></div>
<div class="pan-controls"><button id="pan-left" class="round-button" aria-label="Nach links schauen" data-icon="left"></button><button id="pan-right" class="round-button" aria-label="Nach rechts schauen" data-icon="right"></button></div>
<nav class="toolbox" aria-label="Spielwerkzeuge"><button data-panel="residents" class="tool-people"><span data-icon="friends"></span><span>Figuren</span></button><button data-panel="furniture" class="tool-furniture"><span data-icon="chair"></span><span>Einrichten</span></button><button data-panel="shop" class="tool-shop"><span data-icon="shop"></span><span>Laden</span></button><button id="learn-button" class="tool-learn"><span data-icon="spark"></span><span>Entdecken</span></button><button id="schedule-button" class="tool-plan"><span aria-hidden="true">▦</span><span>Plan</span></button></nav>
<button id="bag-button" class="bag-button" aria-label="Tasche öffnen. Objekte hierher ziehen zum Einpacken."><span data-icon="bag"></span><span id="bag-count">0</span><small>Tasche</small></button>
<a class="legal-link" href="impressum.html" target="_blank" rel="noopener">Impressum</a>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="dialog-top"><div><p class="eyebrow" id="panel-kicker"></p><h2 id="panel-title"></h2></div><button class="icon-button" id="close-panel" aria-label="Schließen">×</button></div><div id="panel-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="learning-dialog" aria-labelledby="learn-title"><button id="learn-close" aria-label="Lernabenteuer schließen">×</button><div id="learning-content"></div></dialog><dialog id="schedule-dialog" aria-labelledby="schedule-title"><button id="schedule-close" aria-label="Stundenplan schließen">×</button><div id="schedule-content"></div></dialog><div id="pwa-notice" role="status" hidden></div></body></html>
